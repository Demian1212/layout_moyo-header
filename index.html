<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moyo header</title>
    <!-- Roboto 500 -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet" />
    <!-- Якщо style.css у корені → ./style.css -->
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <header class="header">
      <a href="/" class="header__logo">
        <img src="src/images/logo.png" alt="Moyo" />
      </a>

      <nav class="header__nav" aria-label="Main navigation">
        <ul class="header__list">
          <li class="headeritem"><a href="#apple" class="headerlink">Apple</a></li>
          <li class="headeritem"><a href="#samsung" class="headerlink">Samsung</a></li>
          <li class="headeritem"><a href="#smartphones" class="headerlink">Smartphones</a></li>
          <li class="header__item">
            <a href="#laptops" class="header__link is-active" data-qa="hover">Laptops & Computers</a>
          </li>
          <li class="headeritem"><a href="#gadgets" class="headerlink">Gadgets</a></li>
          <li class="headeritem"><a href="#tablets" class="headerlink">Tablets</a></li>
          <li class="headeritem"><a href="#photo" class="headerlink">Photo</a></li>
          <li class="headeritem"><a href="#video" class="headerlink">Video</a></li>
        </ul>
      </nav>
    </header>
  </body>
</html>
